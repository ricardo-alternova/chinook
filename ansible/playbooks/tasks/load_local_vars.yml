- name: Check local workstation overrides
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../group_vars/local.yml"
  register: local_workstation_vars

- name: Load local workstation overrides
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../group_vars/local.yml"
  when: local_workstation_vars.stat.exists

- name: Restrict local.yml permissions
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../group_vars/local.yml"
    mode: "0600"
  when: local_workstation_vars.stat.exists

# Chinook only ever configures the account running it. set_fact outranks
# include_vars, so an old local.yml with a different user or home is ignored.
- name: Configure the account running Chinook
  ansible.builtin.set_fact:
    workstation_user: "{{ ansible_facts['user_id'] }}"
    workstation_home: "{{ ansible_facts['env']['HOME'] }}"
    # Linux gives each user a group of the same name; macOS uses staff.
    workstation_group: "{{ ansible_facts['user_gid'] }}"

# GNOME and the shell use English directory names by default. Ask XDG instead,
# so a Spanish or German desktop gets ~/Imágenes and ~/Descargas rather than
# new ~/Pictures and ~/Downloads folders next to them.
- name: Find the user's XDG directories
  ansible.builtin.command: "xdg-user-dir {{ item }}"
  loop:
    - DOCUMENTS
    - PICTURES
    - DOWNLOAD
  register: chinook_xdg_dirs
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['system'] == 'Linux'

- name: Remember the user's XDG directories
  ansible.builtin.set_fact:
    xdg_documents_dir: >-
      {{ ((chinook_xdg_dirs.results | selectattr('item', 'equalto', 'DOCUMENTS') | map(attribute='stdout') | first | default('')) | trim)
         or (workstation_home ~ '/Documents') }}
    xdg_pictures_dir: >-
      {{ ((chinook_xdg_dirs.results | selectattr('item', 'equalto', 'PICTURES') | map(attribute='stdout') | first | default('')) | trim)
         or (workstation_home ~ '/Pictures') }}
    xdg_download_dir: >-
      {{ ((chinook_xdg_dirs.results | selectattr('item', 'equalto', 'DOWNLOAD') | map(attribute='stdout') | first | default('')) | trim)
         or (workstation_home ~ '/Downloads') }}
  when: ansible_facts['system'] == 'Linux'

# Keep an explicit local.yml value; only replace the empty defaults.
- name: Default local paths to the user's XDG directories
  ansible.builtin.set_fact:
    dev_dir: "{{ dev_dir | default('') or (xdg_documents_dir ~ '/Dev') }}"
    gnome_screenshots_dir: "{{ gnome_screenshots_dir | default('') or (xdg_pictures_dir ~ '/Screenshots') }}"
    gnome_screenshots_redirect_target: "{{ gnome_screenshots_redirect_target | default('') or xdg_download_dir }}"
  when: ansible_facts['system'] == 'Linux'
