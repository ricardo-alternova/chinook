- name: Check local workstation overrides
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../group_vars/local.yml"
  register: local_workstation_vars

- name: Load local workstation overrides
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../group_vars/local.yml"
  when: local_workstation_vars.stat.exists

- name: Restrict local.yml permissions
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../group_vars/local.yml"
    mode: "0600"
  when: local_workstation_vars.stat.exists

# Chinook only ever configures the account running it. set_fact outranks
# include_vars, so an old local.yml with a different user or home is ignored.
- name: Configure the account running Chinook
  ansible.builtin.set_fact:
    workstation_user: "{{ ansible_facts['user_id'] }}"
    workstation_home: "{{ ansible_facts['env']['HOME'] }}"
