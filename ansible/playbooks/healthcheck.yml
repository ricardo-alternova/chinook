---
- name: Audit and repair a Chinook workstation
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Load local workstation overrides
      ansible.builtin.import_tasks: tasks/load_local_vars.yml
      tags: always

  roles:
    - role: healthcheck
      tags: healthcheck
