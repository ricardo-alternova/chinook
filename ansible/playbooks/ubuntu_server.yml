- name: Configure Ubuntu Server
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/ubuntu_server.yml

  pre_tasks:
    - name: Load local workstation overrides
      ansible.builtin.import_tasks: tasks/load_local_vars.yml
      tags: always

  roles:
    - role: packages
      tags: packages
      when: install_packages | bool
    - role: timeshift
      tags: timeshift
      when: configure_timeshift | bool
    - role: tmux
      tags: tmux
      when: configure_tmux | bool
    - role: tailscale
      tags: tailscale
      when: install_tailscale | bool
    - role: ufw
      tags: ufw
      when: configure_ufw | bool
    - role: fail2ban
      tags: fail2ban
      when: configure_fail2ban | bool
    - role: ssh_client
      tags: ssh_client
      when: configure_ssh | bool
    - role: onedrive
      tags: onedrive
      when: install_onedrive | bool
    - role: opencode_cli
      tags: opencode_cli
      when: install_opencode_cli | bool
    - role: codex_cli
      tags: codex_cli
      when: install_codex_cli | bool
    - role: t3_code
      tags: t3_code
      when: install_t3_code | bool
    - role: keychron
      tags: keychron
      when: configure_keychron | bool
