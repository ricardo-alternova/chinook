- name: Configure Ubuntu Server
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/ubuntu_server.yml

  pre_tasks:
    - name: Check local workstation overrides
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../group_vars/local.yml"
      register: local_workstation_vars
      tags: always

    - name: Load local workstation overrides
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/local.yml"
      when: local_workstation_vars.stat.exists
      tags: always

  roles:
    - role: packages
      tags: packages
      when: install_packages | bool
    - role: timeshift
      tags: timeshift
      when: configure_timeshift | bool
    - role: tmux
      tags: tmux
      when: configure_tmux | bool
    - role: tailscale
      tags: tailscale
      when: install_tailscale | bool
    - role: ssh_client
      tags: ssh_client
      when: configure_ssh | bool
    - role: onedrive
      tags: onedrive
      when: install_onedrive | bool
    - role: opencode_cli
      tags: opencode_cli
      when: install_opencode_cli | bool
    - role: codex_cli
      tags: codex_cli
      when: install_codex_cli | bool
    - role: t3_code
      tags: t3_code
      when: install_t3_code | bool
    - role: keychron
      tags: keychron
      when: configure_keychron | bool
