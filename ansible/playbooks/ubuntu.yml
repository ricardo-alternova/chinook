- name: Configure Ubuntu workstation
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/ubuntu.yml

  pre_tasks:
    - name: Load local workstation overrides
      ansible.builtin.import_tasks: tasks/load_local_vars.yml
      tags: always

    - name: Gather package facts for desktop detection
      ansible.builtin.package_facts:
        manager: auto
      become: true
      tags: always

    - name: Fail when the Ubuntu GNOME playbook is run without GNOME
      ansible.builtin.fail:
        msg: >-
          This playbook is for Ubuntu GNOME. gnome-shell is not installed on this
          machine. Use ansible/playbooks/ubuntu_server.yml instead.
      when:
        - ansible_facts.packages is defined
        - ansible_facts.packages | length > 0
        - "'gnome-shell' not in ansible_facts.packages"
      tags: always

  roles:
    - role: packages
      tags: packages
      when: install_packages | bool
    - role: snaps
      tags: snaps
      when: install_snap_apps | bool
    - role: timeshift
      tags: timeshift
      when: configure_timeshift | bool
    - role: tmux
      tags: tmux
      when: configure_tmux | bool
    - role: tailscale
      tags: tailscale
      when: install_tailscale | bool
    - role: ufw
      tags: ufw
      when: configure_ufw | bool
    - role: fail2ban
      tags: fail2ban
      when: configure_fail2ban | bool
    - role: ssh_client
      tags: ssh_client
      when: configure_ssh | bool
    - role: onedrive
      tags: onedrive
      when: install_onedrive | bool
    - role: gnome
      tags: gnome
      when: configure_gnome | bool
    - role: mangohud
      tags: mangohud
      when: install_mangohud | bool
    - role: opencode_cli
      tags: opencode_cli
      when: install_opencode_cli | bool
    - role: opencode_desktop
      tags: opencode_desktop
      when: install_opencode_desktop | bool
    - role: codex_cli
      tags: codex_cli
      when: install_codex_cli | bool
    - role: grok_bot
      tags: grok_bot
      when: install_grok_bot | bool
    - role: cursor
      tags: cursor
      when: install_cursor | bool
    - role: t3_code
      tags: t3_code
      when: install_t3_code | bool
    - role: helium
      tags: helium
      when: install_helium | bool
    - role: keychron
      tags: keychron
      when: configure_keychron | bool
    - role: zed
      tags: zed
      when: install_zed | bool
    - role: balena_etcher
      tags: balena_etcher
      when: install_balena_etcher | bool
    - role: teams_pwa
      tags: teams_pwa
      when: configure_teams_pwa | bool
    - role: desktop_shortcuts
      tags: desktop_shortcuts
      when: configure_desktop_shortcuts | bool
