workstation_user: "{{ ansible_facts['user_id'] }}"
workstation_home: "{{ ansible_facts['env']['HOME'] }}"
workstation_group: "{{ ansible_facts['user_gid'] }}"
dev_dir: "{{ workstation_home }}/Documents/Dev"
# Empty leaves the hostname alone. Fleet lists devices by hostname (nombre-apellido).
workstation_hostname: ""

install_packages: false
install_snap_apps: false
install_flatpak_apps: false
install_onedrive: false
install_mangohud: false
install_opencode_cli: false
install_opencode_desktop: false
install_codex_cli: false
install_claude_code: false
install_cursor_cli: false
install_glab: false
install_starship: false
install_unity_cli: false
install_grok_bot: false
install_cursor: false
install_helium: false
install_unity_hub: false
install_zed: false
install_balena_etcher: false
install_t3_code: false
install_tailscale: false
install_docker: false
install_fleet: false
install_compai_agent: false

configure_shell: false
configure_kitty: false
configure_timeshift: false
configure_ssh: false
configure_gnome: false
configure_kde: false
configure_tmux: false
configure_ufw: false
configure_fail2ban: false
configure_keychron: false
configure_teams_pwa: false
configure_desktop_shortcuts: false

tmux_session_name: main
tmux_status_bg: colour24
tmux_status_fg: white
tailscale_auth_key: ""
tailscale_ssh: false

ufw_default_incoming: deny
ufw_default_outgoing: allow
ufw_default_routed: deny
ufw_allow_openssh: true
ufw_allow_tailscale: "{{ install_tailscale }}"
ufw_allowed_ports: []

fail2ban_packages:
  - fail2ban
fail2ban_sshd_port: ssh
fail2ban_sshd_maxretry: 5
fail2ban_sshd_findtime: 10m
fail2ban_sshd_bantime: 1h
fail2ban_ignoreip: 127.0.0.1/8 ::1
fail2ban_banaction: ""

apt_packages: []
apt_packages_extra: []
apt_foreign_architectures: []
apt_foreign_architectures_extra: []
apt_google_chrome_enabled: false

dnf_packages: []
dnf_packages_extra: []
dnf_remove_packages: []
dnf_remove_packages_keep: []
dnf_install_allowerasing: false
rpmfusion_release_packages: []

snap_packages: []
snap_packages_extra: []
flatpak_packages: []
flatpak_packages_extra: []
flatpak_remote_name: flathub
flatpak_remote_url: https://flathub.org/repo/flathub.flatpakrepo

# macOS: Homebrew formulae and casks.
brew_packages: []
brew_packages_extra: []
brew_casks: []
brew_casks_extra: []
# Casks the configurator found already installed outside Homebrew; reported, not installed.
brew_casks_present: []

desktop_shortcuts: []

onedrive_sync_dir: "~/OneDrive"
onedrive_sync_list: []

timeshift_enabled: true
timeshift_package_name: timeshift
timeshift_backup_device_uuid: auto
timeshift_daily_count: 7
timeshift_create_initial_snapshot: true
timeshift_exclude:
  - /home/*/**
  - /root/**
  # Images and containers are large and can be pulled again.
  - /var/lib/docker/**
  - /var/lib/containerd/**

ssh_hosts: []

gnome_color_scheme: prefer-dark
gnome_gtk_theme: Yaru-dark
gnome_screenshots_dir: "{{ workstation_home }}/Pictures/Screenshots"
gnome_screenshots_redirect_target: "{{ workstation_home }}/Downloads"

wayshot_flatpak: io.github.gutopardini.wayshot
wayshot_command: "flatpak run --env=WAYSHOT_CAPTURE=1 io.github.gutopardini.wayshot"
wayshot_keybinding_path: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/
wayshot_keybinding_name: WayShot
wayshot_keybinding_binding: Print
kde_wayshot_desktop_file: "{{ workstation_home }}/.local/share/applications/wayshot-capture.desktop"

kde_color_scheme: BreezeDark
kde_look_and_feel_package: org.kde.breezedark.desktop

keychron_vendor_id: ""
keychron_product_id: ""

zed_install_path: "{{ workstation_home }}/.local/bin/zed"
zed_settings_path: "{{ workstation_home }}/.config/zed/settings.json"

mangohud_config_path: "{{ workstation_home }}/.config/MangoHud/MangoHud.conf"
mangohud_font_size: 30

opencode_cli_install_path: "{{ workstation_home }}/.opencode/bin/opencode"
opencode_cli_install_dir: "{{ opencode_cli_install_path | dirname }}"

codex_cli_bin_path: "{{ workstation_home }}/.local/bin/codex"
claude_code_bin_path: "{{ workstation_home }}/.local/bin/claude"
cursor_cli_bin_path: "{{ workstation_home }}/.local/bin/cursor-agent"

starship_bin_dir: /usr/local/bin

shell_zsh_path: /usr/bin/zsh
shell_install_nerd_font_symbols: true
shell_nerd_font_symbols_url: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/NerdFontsSymbolsOnly.tar.xz
shell_nerd_font_symbols_dir: "{{ workstation_home }}/.local/share/fonts/NerdFontsSymbolsOnly"

kitty_config_dir: "{{ workstation_home }}/.config/kitty"

unity_cli_install_url: https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh
# No stable Unity CLI release yet; set to "" once one ships.
unity_cli_channel: beta
unity_cli_bin_path: "{{ workstation_home }}/.local/bin/unity"

glab_latest_release_api: https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/releases/permalink/latest
glab_releases_base_url: https://gitlab.com/gitlab-org/cli/-/releases

grok_bot_user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
grok_bot_api_base: https://api2.cursor.sh/updates/download/stable
grok_bot_downloads_base: https://downloads.cursor.com/grokbot/stable
grok_bot_deb_url: ""
grok_bot_rpm_url: ""
grok_bot_fallback_deb_urls:
  x64: https://api2.cursor.sh/updates/download/stable/linux-x64/grok-bot-fb0a830618be0c54
  arm64: https://api2.cursor.sh/updates/download/stable/linux-arm64/grok-bot-922bf0a2bf7ebaa3

cursor_user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
cursor_downloads_url: https://cursor.com/downloads
cursor_deb_url: ""
cursor_rpm_url: ""
cursor_fallback_deb_urls:
  x64: https://api2.cursor.sh/updates/download/golden/linux-x64-deb/cursor/3.19
  arm64: https://api2.cursor.sh/updates/download/golden/linux-arm64-deb/cursor/3.19
cursor_fallback_rpm_urls:
  x64: https://api2.cursor.sh/updates/download/golden/linux-x64-rpm/cursor/3.19
  arm64: https://api2.cursor.sh/updates/download/golden/linux-arm64-rpm/cursor/3.19

opencode_desktop_package_name: opencode
opencode_desktop_release_base_url: https://github.com/anomalyco/opencode/releases/latest/download

helium_package_name: helium-bin
helium_apt_key_url: https://raw.githubusercontent.com/imputnet/helium-linux/main/pubkey.asc
helium_apt_key_path: /etc/apt/keyrings/helium.gpg
helium_apt_repo_url: https://pkg.helium.computer/deb
helium_copr_project: imput/helium

unity_hub_package_name: unityhub
unity_hub_apt_key_url: https://hub.unity3d.com/linux/keys/public
# Must match what the unityhub package's postinst writes, or apt sees conflicting Signed-By values.
unity_hub_apt_key_path: /usr/share/keyrings/Unity_Technologies_ApS.gpg
unity_hub_apt_sources_path: /etc/apt/sources.list.d/unityhub.sources
unity_hub_apt_repo_url: https://hub.unity3d.com/linux/repos/deb

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_conflicting_apt_packages:
  - docker.io
  - docker-compose
  - docker-compose-v2
  - docker-doc
  - podman-docker
  - containerd
  - runc
docker_conflicting_dnf_packages:
  - docker
  - docker-client
  - docker-client-latest
  - docker-common
  - docker-latest
  - docker-latest-logrotate
  - docker-logrotate
  - docker-selinux
  - docker-engine-selinux
  - docker-engine
  - podman-docker
docker_apt_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_apt_key_path: /etc/apt/keyrings/docker.asc
docker_apt_sources_path: /etc/apt/sources.list.d/docker.sources
docker_apt_repo_url: https://download.docker.com/linux/ubuntu
docker_rpm_key_url: https://download.docker.com/linux/fedora/gpg
docker_dnf_repo_url: https://download.docker.com/linux/fedora/docker-ce.repo

fleet_url: https://fleet.alternova.dev
# Set in local.yml (the configurator asks for it). Never commit it: this repo is public.
fleet_enroll_secret: ""
# Optional. Links the device to its owner in Fleet.
fleet_end_user_email: ""
fleet_desktop: false
fleet_enable_scripts: true
# auto picks 'uuid' (Fleet's default), or 'instance' when the hardware UUID is a
# placeholder that many machines share, which would merge them into one Fleet host.
fleet_host_identifier: auto
fleet_placeholder_uuids:
  - ""
  - 00000000-0000-0000-0000-000000000000
  - ffffffff-ffff-ffff-ffff-ffffffffffff
  - 03000200-0400-0500-0006-000700080009
fleet_enroll_timeout: 300
fleet_macos_plist: /Library/LaunchDaemons/com.fleetdm.orbit.plist
fleet_macos_service: system/com.fleetdm.orbit
fleetctl_latest_release_api: https://api.github.com/repos/fleetdm/fleet/releases/latest
fleetctl_releases_base_url: https://github.com/fleetdm/fleet/releases/download

compai_agent_repo_url: https://github.com/trycompai/comp
compai_agent_package_name: comp-ai-device-agent
compai_agent_desktop_file: /usr/share/applications/comp-ai-device-agent.desktop
# What the agent's Linux checks require.
compai_password_min_length: 8
compai_screen_lock_max_seconds: 900
compai_screen_lock_idle_seconds: 300

t3_code_install_dir: /opt/t3-code
t3_code_extract_dir: /tmp/t3-code-extract
t3_code_appimage_path: "{{ t3_code_install_dir }}/T3-Code.AppImage"
t3_code_bin_path: /usr/local/bin/t3-code
t3_code_desktop_file: /usr/share/applications/t3-code.desktop

teams_pwa_name: Microsoft Teams (PWA)
teams_pwa_url: "https://teams.cloud.microsoft/?clientType=pwa"
teams_pwa_app_id: ""
teams_pwa_profile_directory: Default
teams_pwa_chrome_bin: /opt/google/chrome/google-chrome
teams_pwa_policy_dir: /etc/opt/chrome/policies/managed
teams_pwa_policy_file: "{{ teams_pwa_policy_dir }}/teams-pwa.json"
teams_pwa_icon_name: "chrome-{{ teams_pwa_app_id }}-{{ teams_pwa_profile_directory }}"
teams_pwa_desktop_file: "{{ workstation_home }}/.local/share/applications/{{ teams_pwa_icon_name }}.desktop"
teams_pwa_desktop_shortcut_file: "{{ workstation_home }}/Desktop/{{ teams_pwa_icon_name }}.desktop"
