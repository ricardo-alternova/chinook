- name: Install UFW
  ansible.builtin.package:
    name: "{{ ['ufw'] + (['openssh-server'] if ufw_allow_openssh | bool else []) }}"
    state: present
  become: true

- name: Validate UFW default policies
  ansible.builtin.fail:
    msg: "UFW default policies must be allow, deny, or reject."
  when: item not in ['allow', 'deny', 'reject']
  loop:
    - "{{ ufw_default_incoming }}"
    - "{{ ufw_default_outgoing }}"
    - "{{ ufw_default_routed }}"

- name: Validate extra UFW port specs
  ansible.builtin.fail:
    msg: "Invalid UFW port spec {{ item }}. Use PORT or PORT/tcp or PORT/udp (1-65535)."
  when: item is not match('^[0-9]{1,5}(/(tcp|udp))?$') or (item.split('/')[0] | int) > 65535
  loop: "{{ ufw_allowed_ports }}"

- name: Fail when UFW would enable without an SSH allow rule
  ansible.builtin.fail:
    msg: >-
      Refusing to configure UFW without an SSH allow rule. Keep ufw_allow_openssh
      enabled, or add your SSH port to ufw_allowed_ports (for example 22/tcp).
  when:
    - not ufw_allow_openssh | bool
    - ufw_allowed_ports | length == 0

# Empty ufw_ssh_sources means "auto": allow SSH from the LAN this machine is on.
# Set it to ["any"] to allow SSH from anywhere, or to a list of CIDRs to override.
- name: Find the default route interface
  ansible.builtin.shell: >-
    set -o pipefail;
    ip -4 route show default
    | awk '{for(i=1;i<=NF;i++) if($i=="dev") print $(i+1)}' | head -1
  args:
    executable: /bin/bash
  register: ufw_default_iface
  changed_when: false
  failed_when: false
  when: ufw_ssh_sources | length == 0

- name: Find the LAN network on the default interface
  ansible.builtin.shell: >-
    set -o pipefail;
    ip -4 route show dev {{ ufw_default_iface.stdout | default('') | trim }} scope link
    | awk '{print $1}' | head -1
  args:
    executable: /bin/bash
  register: ufw_lan_cidr
  changed_when: false
  failed_when: false
  when:
    - ufw_ssh_sources | length == 0
    - ufw_default_iface.stdout | default('') | trim | length > 0

- name: Resolve the SSH sources
  ansible.builtin.set_fact:
    ufw_resolved_ssh_sources: >-
      {{ ufw_ssh_sources
         if ufw_ssh_sources | length > 0
         else ([ufw_lan_cidr.stdout | trim]
               if (ufw_lan_cidr | default({})).get('stdout', '') | trim | length > 0
               else []) }}

- name: Remove a world-open SSH rule from an older Chinook
  ansible.builtin.command:
    argv:
      - ufw
      - delete
      - allow
      - "{{ ufw_ssh_port }}/tcp"
  become: true
  register: ufw_delete_open_ssh
  changed_when: ufw_delete_open_ssh.stdout is search('(?i)rule deleted|rules updated')
  failed_when: false
  when: "'any' not in ufw_resolved_ssh_sources"

- name: Remove a world-open OpenSSH application rule from an older Chinook
  ansible.builtin.command:
    argv:
      - ufw
      - delete
      - allow
      - OpenSSH
  become: true
  register: ufw_delete_open_openssh
  changed_when: ufw_delete_open_openssh.stdout is search('(?i)rule deleted|rules updated')
  failed_when: false
  when: "'any' not in ufw_resolved_ssh_sources"

- name: Allow SSH through UFW from the resolved sources
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - from
      - "{{ item }}"
      - to
      - any
      - port
      - "{{ ufw_ssh_port }}"
      - proto
      - tcp
  become: true
  loop: "{{ ufw_resolved_ssh_sources }}"
  register: ufw_allow_openssh_sources_result
  changed_when: ufw_allow_openssh_sources_result.stdout is search('(?i)rule added|rules updated')
  when:
    - ufw_allow_openssh | bool
    - item != 'any'

- name: Allow SSH through UFW from anywhere
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - "{{ ufw_ssh_port }}/tcp"
  become: true
  register: ufw_allow_openssh_result
  changed_when: ufw_allow_openssh_result.stdout is search('(?i)rule added|rules updated')
  when:
    - ufw_allow_openssh | bool
    - "'any' in ufw_resolved_ssh_sources"

- name: Allow extra UFW ports
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - "{{ item }}"
  become: true
  loop: "{{ ufw_allowed_ports }}"
  register: ufw_allow_port_result
  changed_when: ufw_allow_port_result.stdout is defined and ufw_allow_port_result.stdout is search('(?i)rule added|rules updated')

# LocalSend needs TCP/UDP 53317 and mDNS for discovery. Only open them when the
# app is selected; the rules are skipped otherwise.
- name: Allow LocalSend through UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - "{{ item }}"
  become: true
  loop: "{{ localsend_ports + [localsend_mdns_port] }}"
  register: ufw_allow_localsend_result
  changed_when: ufw_allow_localsend_result.stdout is search('(?i)rule added|rules updated')
  when: localsend_enabled | bool

- name: Allow traffic on the Tailscale interface
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - in
      - "on"
      - tailscale0
  become: true
  register: ufw_allow_tailscale_result
  changed_when: ufw_allow_tailscale_result.stdout is search('(?i)rule added|rules updated')
  when: ufw_allow_tailscale | bool

- name: Read added UFW rules
  ansible.builtin.command:
    argv:
      - ufw
      - show
      - added
  register: ufw_added_rules
  changed_when: false
  check_mode: false
  become: true

- name: Fail when SSH is still not allowed before tightening UFW
  ansible.builtin.fail:
    msg: >-
      UFW has no SSH allow rule after the allow tasks. Refusing to
      change the default policy or enable the firewall.
  when:
    - not ansible_check_mode
    - ufw_allow_openssh | bool
    - ufw_added_rules.stdout is not search('(?:' ~ ufw_ssh_port ~ '/tcp|OpenSSH|port ' ~ ufw_ssh_port ~ '|tailscale0)')

- name: Read UFW status
  ansible.builtin.command:
    argv:
      - ufw
      - status
      - verbose
  register: ufw_status
  changed_when: false
  check_mode: false
  become: true

- name: Set UFW default policies
  ansible.builtin.command:
    argv:
      - ufw
      - default
      - "{{ item.policy }}"
      - "{{ item.direction }}"
  become: true
  loop:
    - { direction: incoming, policy: "{{ ufw_default_incoming }}" }
    - { direction: outgoing, policy: "{{ ufw_default_outgoing }}" }
    - { direction: routed, policy: "{{ ufw_default_routed }}" }
  changed_when: (item.policy ~ ' (' ~ item.direction ~ ')') not in ufw_status.stdout

- name: Enable UFW
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - enable
  become: true
  changed_when: "'Status: active' not in ufw_status.stdout"
  when:
    - not ansible_check_mode
    - "'Status: active' not in ufw_status.stdout"
