---
# Linux only: macOS installs T3 Code through the `t3-code` Homebrew cask
# (selected in tools/configure.py), so this role is not part of macos.yml.
- name: Install FUSE 2 library required to run AppImages
  ansible.builtin.package:
    name: "{{ 'libfuse2t64' if ansible_facts['pkg_mgr'] == 'apt' else 'fuse-libs' }}"
    state: present
  become: true

- name: Fetch latest T3 Code release metadata
  ansible.builtin.uri:
    url: https://api.github.com/repos/pingdotgg/t3code/releases/latest
    return_content: true
  register: t3_code_release

- name: Choose the T3 Code AppImage architecture
  ansible.builtin.set_fact:
    t3_code_appimage_arch: >-
      {{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'x86_64' }}

- name: Select T3 Code AppImage asset URL
  ansible.builtin.set_fact:
    t3_code_appimage_url: >-
      {{ (t3_code_release.json.assets
          | selectattr('name', 'search', '-' ~ t3_code_appimage_arch ~ '.AppImage$')
          | map(attribute='browser_download_url')
          | list | first) | default('', true) }}

- name: Fail when no T3 Code AppImage exists for this architecture
  ansible.builtin.fail:
    msg: "T3 Code publishes no {{ t3_code_appimage_arch }} AppImage in {{ t3_code_release.json.tag_name }}."
  when: t3_code_appimage_url | length == 0

- name: Set the versioned T3 Code AppImage path
  ansible.builtin.set_fact:
    t3_code_versioned_appimage_path: >-
      {{ t3_code_install_dir }}/T3-Code-{{ t3_code_release.json.tag_name }}-{{ t3_code_appimage_arch }}.AppImage

- name: Ensure T3 Code installation directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ t3_code_install_dir }}"
    - /usr/local/bin
    - /usr/share/applications
  become: true

# get_url leaves an existing destination alone, so a file from an older release
# (or the old x86_64 build on arm64) would be reused forever. Keep one file per
# release and architecture, download to a temporary name, and only then move it
# into place so a partial download is never mistaken for a complete AppImage.
- name: Check the current T3 Code AppImage
  ansible.builtin.stat:
    path: "{{ t3_code_versioned_appimage_path }}"
  register: t3_code_current_appimage

- name: Download T3 Code AppImage
  ansible.builtin.get_url:
    url: "{{ t3_code_appimage_url }}"
    dest: "{{ t3_code_versioned_appimage_path }}.part"
    mode: "0755"
    force: true
    timeout: 600
  register: t3_code_appimage_download
  become: true
  when: not t3_code_current_appimage.stat.exists

- name: Move the downloaded T3 Code AppImage into place
  ansible.builtin.command:
    argv:
      - mv
      - -f
      - "{{ t3_code_versioned_appimage_path }}.part"
      - "{{ t3_code_versioned_appimage_path }}"
  become: true
  when:
    - t3_code_appimage_download is not skipped
    - t3_code_appimage_download.changed

- name: Check the stable T3 Code AppImage path
  ansible.builtin.stat:
    path: "{{ t3_code_appimage_path }}"
  register: t3_code_stable_appimage

# Before the versioned files, this path held the AppImage itself. Remove that
# regular file so it can become a symlink to the current release.
- name: Remove a stale non-symlink T3 Code AppImage
  ansible.builtin.file:
    path: "{{ t3_code_appimage_path }}"
    state: absent
  become: true
  when:
    - t3_code_stable_appimage.stat.exists
    - not t3_code_stable_appimage.stat.islnk

- name: Point the stable T3 Code AppImage path at the current release
  ansible.builtin.file:
    src: "{{ t3_code_versioned_appimage_path }}"
    dest: "{{ t3_code_appimage_path }}"
    state: link
    force: true
  become: true

- name: Find older T3 Code AppImages
  ansible.builtin.find:
    paths: "{{ t3_code_install_dir }}"
    patterns: "T3-Code-*.AppImage*"
    file_type: file
  register: t3_code_old_appimages

- name: Remove older T3 Code AppImages
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ t3_code_old_appimages.files | rejectattr('path', 'equalto', t3_code_versioned_appimage_path) | list }}"
  loop_control:
    label: "{{ item.path | basename }}"
  become: true

- name: Remove previous T3 Code extraction directory
  ansible.builtin.file:
    path: "{{ t3_code_extract_dir }}"
    state: absent
  become: true

- name: Ensure T3 Code extraction directory exists
  ansible.builtin.file:
    path: "{{ t3_code_extract_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# A wrong-architecture AppImage would otherwise hang forever in Fedora Asahi's
# FEX binfmt handler. The timeout turns that into a clear, fast failure.
- name: Extract T3 Code AppImage to access bundled icons
  ansible.builtin.command:
    argv:
      - timeout
      - "180"
      - "{{ t3_code_versioned_appimage_path }}"
      - --appimage-extract
  args:
    chdir: "{{ t3_code_extract_dir }}"
  become: true
  changed_when: false

- name: Find bundled T3 Code icons
  ansible.builtin.find:
    paths: "{{ t3_code_extract_dir }}/squashfs-root/usr/share/icons/hicolor"
    patterns: t3code.png
    recurse: true
  register: t3_code_icons

- name: Ensure T3 Code icon directories exist
  ansible.builtin.file:
    path: "/usr/share/icons/hicolor/{{ item }}/apps"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - 16x16
    - 22x22
    - 24x24
    - 32x32
    - 48x48
    - 64x64
    - 128x128
    - 256x256
    - 512x512
  become: true

- name: Install bundled T3 Code icons into the system theme
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/usr/share/icons/hicolor/{{ item.path | regex_replace('.*/hicolor/', '') }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ t3_code_icons.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('.*/hicolor/', '') }}"
  become: true

- name: Remove T3 Code extraction directory
  ansible.builtin.file:
    path: "{{ t3_code_extract_dir }}"
    state: absent
  become: true

- name: Link T3 Code AppImage into PATH
  ansible.builtin.file:
    src: "{{ t3_code_appimage_path }}"
    dest: "{{ t3_code_bin_path }}"
    state: link
    force: true
  become: true

- name: Create T3 Code desktop launcher
  ansible.builtin.copy:
    dest: "{{ t3_code_desktop_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Desktop Entry]
      Name=T3 Code
      Comment=Control your AI coding agents
      Exec={{ t3_code_bin_path }} %U
      Terminal=false
      Type=Application
      Icon=t3code
      Categories=Development;Utility;
      StartupNotify=true
      StartupWMClass=t3code
  become: true

- name: Check update-desktop-database
  ansible.builtin.shell: command -v update-desktop-database
  args:
    executable: /bin/bash
  register: t3_code_update_desktop_database
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check gtk-update-icon-cache
  ansible.builtin.shell: command -v gtk-update-icon-cache
  args:
    executable: /bin/bash
  register: t3_code_gtk_update_icon_cache
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refresh T3 Code desktop database
  ansible.builtin.command: update-desktop-database /usr/share/applications
  become: true
  changed_when: false
  when: t3_code_update_desktop_database.rc == 0

- name: Refresh T3 Code icon cache
  ansible.builtin.command: gtk-update-icon-cache /usr/share/icons/hicolor
  become: true
  changed_when: false
  when: t3_code_gtk_update_icon_cache.rc == 0
