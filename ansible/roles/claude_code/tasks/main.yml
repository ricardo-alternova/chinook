- name: Ensure Claude Code install dependencies are present
  ansible.builtin.package:
    name: curl
    state: present
  become: true

# Claude Code updates itself after the first install, so only run the installer when it is missing.
- name: Install Claude Code with official installer
  ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
    creates: "{{ claude_code_bin_path }}"
  become: true
  become_user: "{{ workstation_user }}"
  environment:
    HOME: "{{ workstation_home }}"

- name: Ensure local bin is in zsh PATH
  ansible.builtin.lineinfile:
    path: "{{ workstation_home }}/.zshrc"
    create: true
    owner: "{{ workstation_user }}"
    group: "{{ workstation_user }}"
    mode: "0644"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
