---
# `install --check` leaves this false; `install --fix` sets it true.
healthcheck_fix: false
# Exit non-zero when the audit finds something. Useful for cron or CI.
healthcheck_fail_on_issues: false
# Warn when a filesystem is at or above this percentage.
healthcheck_disk_warn_percent: 85
# How far back to look for OOM kills.
healthcheck_oom_lookback_days: 30
# Plain-text report location.
healthcheck_report_path: "{{ workstation_home }}/.local/state/chinook/healthcheck.txt"
# Replace a world-open SSH rule with LAN + tailscale0 rules.
healthcheck_scope_ssh: true
# Remove the snap Tailscale when the apt package is the one installed.
healthcheck_remove_duplicate_tailscale_snap: false
# Turn off SSH password auth, but only when the user already has a key.
healthcheck_disable_ssh_password: false
