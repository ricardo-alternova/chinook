- name: Install Timeshift
  ansible.builtin.package:
    name: "{{ timeshift_package_name }}"
    state: present
  become: true
  when: timeshift_enabled | bool

- name: Ensure Timeshift config directory exists
  ansible.builtin.file:
    path: /etc/timeshift
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: timeshift_enabled | bool

- name: Detect root filesystem UUID for Timeshift
  ansible.builtin.command: findmnt -no UUID /
  register: timeshift_root_uuid
  changed_when: false
  check_mode: false
  when:
    - timeshift_enabled | bool
    - timeshift_backup_device_uuid == 'auto'

- name: Resolve Timeshift backup device UUID
  ansible.builtin.set_fact:
    timeshift_resolved_backup_device_uuid: >-
      {{ timeshift_root_uuid.stdout if timeshift_backup_device_uuid == 'auto' else timeshift_backup_device_uuid }}
  when: timeshift_enabled | bool

- name: Fail when Timeshift backup UUID cannot be resolved
  ansible.builtin.fail:
    msg: "Could not resolve a Timeshift backup device UUID. Set timeshift_backup_device_uuid explicitly."
  when:
    - timeshift_enabled | bool
    - timeshift_resolved_backup_device_uuid | length == 0

- name: Render Timeshift config files
  ansible.builtin.template:
    src: default.json.j2
    dest: "/etc/timeshift/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop:
    - default.json
    - timeshift.json
  when: timeshift_enabled | bool

- name: Install Timeshift scheduled check service
  ansible.builtin.template:
    src: timeshift-check.service.j2
    dest: /etc/systemd/system/timeshift-check.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd
  when: timeshift_enabled | bool

- name: Install Timeshift daily timer
  ansible.builtin.template:
    src: timeshift-check.timer.j2
    dest: /etc/systemd/system/timeshift-check.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd
  when: timeshift_enabled | bool

- name: Enable Timeshift daily timer
  ansible.builtin.systemd:
    name: timeshift-check.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when:
    - timeshift_enabled | bool
    - not ansible_check_mode

- name: List existing Timeshift snapshots
  ansible.builtin.command: timeshift --list --scripted --snapshot-device {{ timeshift_resolved_backup_device_uuid }}
  become: true
  register: timeshift_snapshot_list
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - timeshift_enabled | bool
    - timeshift_create_initial_snapshot | bool

- name: Create initial Timeshift daily snapshot when none exist
  ansible.builtin.command: timeshift --create --scripted --yes --snapshot-device {{ timeshift_resolved_backup_device_uuid }} --tags D --comments "Initial Ansible snapshot"
  become: true
  when:
    - timeshift_enabled | bool
    - timeshift_create_initial_snapshot | bool
    - not ansible_check_mode
    - timeshift_snapshot_list.stdout is not search('[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}')

- name: Disable Timeshift daily timer when disabled
  ansible.builtin.systemd:
    name: timeshift-check.timer
    enabled: false
    state: stopped
  become: true
  failed_when: false
  when: not timeshift_enabled | bool
