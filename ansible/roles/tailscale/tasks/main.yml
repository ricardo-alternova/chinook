# macOS uses the standalone Tailscale app (a signed .pkg). Installing it with
# `installer` under Ansible's become keeps the sudo prompt in Ansible's hands,
# unlike a Homebrew cask that installs a pkg.
- name: Install Tailscale on macOS
  when: ansible_facts['system'] == 'Darwin'
  block:
    - name: Read the installed Tailscale version
      ansible.builtin.command:
        argv:
          - /usr/libexec/PlistBuddy
          - -c
          - Print :CFBundleShortVersionString
          - /Applications/Tailscale.app/Contents/Info.plist
      register: tailscale_macos_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Find the latest Tailscale macOS package
      ansible.builtin.command: >-
        curl -fsIL --max-time 30 https://pkgs.tailscale.com/stable/Tailscale-latest-macos.pkg
      register: tailscale_macos_headers
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Parse the latest Tailscale macOS version
      ansible.builtin.set_fact:
        tailscale_macos_version: >-
          {{ (tailscale_macos_headers.stdout
              | regex_findall('Tailscale-([0-9]+\.[0-9]+\.[0-9]+)-macos\.pkg')
              | first) | default('', true) }}

    - name: Fail when the latest Tailscale macOS package cannot be resolved
      ansible.builtin.fail:
        msg: "Could not determine the latest Tailscale macOS version from pkgs.tailscale.com."
      when: tailscale_macos_version | length == 0

    - name: Download the Tailscale macOS package
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/Tailscale-latest-macos.pkg
        dest: "{{ tailscale_macos_pkg }}"
        mode: "0644"
        timeout: 600
      when: tailscale_macos_installed.stdout | default('') | trim != tailscale_macos_version

    - name: Install the Tailscale macOS app
      ansible.builtin.command:
        argv:
          - /usr/sbin/installer
          - -pkg
          - "{{ tailscale_macos_pkg }}"
          - -target
          - /
      become: true
      when: tailscale_macos_installed.stdout | default('') | trim != tailscale_macos_version

    - name: Remove the downloaded Tailscale package
      ansible.builtin.file:
        path: "{{ tailscale_macos_pkg }}"
        state: absent

    - name: Remind to open and sign in to Tailscale
      ansible.builtin.debug:
        msg: >-
          Open Tailscale from Applications and sign in to join your tailnet. If macOS asks,
          allow the system extension in System Settings → Privacy & Security.

- name: Install Tailscale on Linux
  when: ansible_facts['system'] == 'Linux'
  block:
    - name: Check whether Tailscale is already installed
      ansible.builtin.stat:
        path: /usr/bin/tailscale
      register: tailscale_binary

    - name: Install Tailscale when missing
      when: not tailscale_binary.stat.exists
      block:
        - name: Ensure Tailscale installer dependencies are present
          ansible.builtin.package:
            name:
              - curl
              - ca-certificates
            state: present
          become: true

        - name: Install Tailscale with the official installer
          ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
          args:
            executable: /bin/bash
          become: true

    - name: Recheck Tailscale binary after install
      ansible.builtin.stat:
        path: /usr/bin/tailscale
      register: tailscale_binary

    - name: Enable Tailscale service
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started
      become: true
      when:
        - not ansible_check_mode
        - tailscale_binary.stat.exists

    - name: Read Tailscale status
      ansible.builtin.command:
        argv:
          - tailscale
          - status
          - --json
      register: tailscale_status
      changed_when: false
      failed_when: false
      check_mode: false
      when: tailscale_binary.stat.exists

    - name: Resolve Tailscale backend state
      ansible.builtin.set_fact:
        tailscale_backend_state: "{{ (tailscale_status.stdout | from_json).BackendState | default('NeedsLogin') }}"
      when:
        - tailscale_binary.stat.exists
        - tailscale_status.stdout is match('^\s*\{')

    - name: Default Tailscale backend state when not connected
      ansible.builtin.set_fact:
        tailscale_backend_state: NeedsLogin
      when: tailscale_backend_state is not defined

    - name: Join Tailscale when an auth key is provided
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - --ssh={{ 'true' if tailscale_ssh | bool else 'false' }}
      become: true
      no_log: true
      environment:
        TS_AUTHKEY: "{{ tailscale_auth_key }}"
      when:
        - tailscale_binary.stat.exists
        - tailscale_auth_key | length > 0
        - tailscale_backend_state != 'Running'

    - name: Report manual Tailscale login when no auth key is set
      ansible.builtin.debug:
        msg: "Tailscale is installed. Run 'sudo tailscale up' as {{ workstation_user }} to join this machine to your tailnet."
      when:
        - tailscale_binary.stat.exists
        - tailscale_auth_key | length == 0
        - tailscale_backend_state != 'Running'
