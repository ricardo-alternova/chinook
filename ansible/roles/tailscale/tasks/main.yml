- name: Check whether Tailscale is already installed
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: tailscale_binary

- name: Ensure Tailscale installer dependencies are present
  ansible.builtin.package:
    name:
      - curl
      - ca-certificates
    state: present
  become: true
  when: not tailscale_binary.stat.exists

- name: Install Tailscale with the official installer
  ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
  args:
    executable: /bin/bash
  become: true
  when: not tailscale_binary.stat.exists

- name: Enable Tailscale service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  become: true
  when: not ansible_check_mode

- name: Read Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Resolve Tailscale backend state
  ansible.builtin.set_fact:
    tailscale_backend_state: "{{ (tailscale_status.stdout | from_json).BackendState | default('NeedsLogin') }}"
  when: tailscale_status.stdout is search('BackendState')

- name: Default Tailscale backend state when status is unavailable
  ansible.builtin.set_fact:
    tailscale_backend_state: NeedsLogin
  when: tailscale_status.stdout is not search('BackendState')

- name: Join Tailscale when an auth key is provided
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - --auth-key={{ tailscale_auth_key }}
      - --ssh={{ 'true' if tailscale_ssh | bool else 'false' }}
  become: true
  no_log: true
  when:
    - tailscale_auth_key | length > 0
    - tailscale_backend_state != 'Running'

- name: Report manual Tailscale login when no auth key is set
  ansible.builtin.debug:
    msg: "Tailscale is installed. Run 'sudo tailscale up' as {{ workstation_user }} to join this machine to your tailnet."
  when:
    - tailscale_auth_key | length == 0
    - tailscale_backend_state != 'Running'
