# macOS: Homebrew installs Colima and the Docker CLI; this role only wires up
# the Compose/Buildx plugins and leaves the VM stopped. Colima is not a login
# item or a launch daemon, so it never starts at boot.
- name: Configure the Docker CLI on macOS
  when: ansible_facts['system'] == 'Darwin'
  block:
    - name: Find Homebrew for the Docker CLI
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/homebrew/bin/brew
        - /usr/local/bin/brew
      register: docker_homebrew_candidates

    - name: Fail when Homebrew is missing on macOS
      ansible.builtin.fail:
        msg: "Homebrew is not installed. The Chinook installer sets it up, or see https://brew.sh."
      when: docker_homebrew_candidates.results | selectattr('stat.exists') | list | length == 0

    - name: Set the Homebrew prefix for Docker
      ansible.builtin.set_fact:
        docker_homebrew_prefix: "{{ ((docker_homebrew_candidates.results | selectattr('stat.exists') | map(attribute='item') | first) | dirname | dirname) }}"

    - name: Check for the Docker CLI
      ansible.builtin.stat:
        path: "{{ docker_homebrew_prefix }}/bin/docker"
      register: docker_cli_binary

    - name: Fail when the Docker formulae are missing
      ansible.builtin.fail:
        msg: >-
          Docker's Homebrew formulae are missing. Enable install_packages or run
          "brew install colima docker docker-compose docker-buildx" and re-run.
      when: not docker_cli_binary.stat.exists

    - name: Ensure the Docker CLI plugin directory exists
      ansible.builtin.file:
        path: "{{ workstation_home }}/.docker/cli-plugins"
        state: directory
        owner: "{{ workstation_user }}"
        group: "{{ workstation_group }}"
        mode: "0755"

    - name: Link the Docker Compose and Buildx plugins
      ansible.builtin.file:
        src: "{{ docker_homebrew_prefix }}/lib/docker/cli-plugins/{{ item }}"
        dest: "{{ workstation_home }}/.docker/cli-plugins/{{ item }}"
        state: link
        force: true
      loop:
        - docker-compose
        - docker-buildx

    - name: Remind to start Colima manually
      ansible.builtin.debug:
        msg: >-
          Docker CLI and Colima are installed. Colima is not started at login; run
          "colima start" when you need Docker, and "colima stop" to shut it down.

- name: Ensure Docker install dependencies are present
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
    state: present
  become: true
  when: ansible_facts['system'] == 'Linux'

# apt path (Ubuntu desktop and server)
- name: Install Docker Engine from Docker's APT repository
  when: ansible_facts['pkg_mgr'] == 'apt'
  block:
    # Distro builds of Docker conflict with Docker's own packages.
    - name: Remove distro Docker packages
      ansible.builtin.apt:
        name: "{{ docker_conflicting_apt_packages }}"
        state: absent
      become: true

    - name: Ensure the APT keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      become: true

    - name: Download Docker's APT signing key
      ansible.builtin.get_url:
        url: "{{ docker_apt_key_url }}"
        dest: "{{ docker_apt_key_path }}"
        mode: "0644"
      become: true
      register: docker_apt_key

    - name: Configure Docker's APT repository
      ansible.builtin.copy:
        dest: "{{ docker_apt_sources_path }}"
        mode: "0644"
        content: |
          Types: deb
          URIs: {{ docker_apt_repo_url }}
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Signed-By: {{ docker_apt_key_path }}
      become: true
      register: docker_apt_sources

    - name: Update APT cache for Docker
      ansible.builtin.apt:
        update_cache: true
      become: true
      when: docker_apt_sources.changed or docker_apt_key.changed

    - name: Install Docker Engine packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
      become: true

# dnf path (Fedora Asahi)
- name: Install Docker Engine from Docker's DNF repository
  when: ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
  block:
    # podman-docker is just a /usr/bin/docker shim. Removing it with dnf pulls
    # container-selinux, which other Fedora packages (passt-selinux) require,
    # so remove only the shim and keep the SELinux policy packages.
    - name: Check for the podman-docker shim
      ansible.builtin.command: rpm -q podman-docker
      register: docker_podman_docker
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Remove the podman-docker shim without pulling dependencies
      ansible.builtin.command: rpm -e --nodeps podman-docker
      become: true
      when:
        - docker_podman_docker.rc == 0
        - not ansible_check_mode

    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Remove installed distro Docker packages
      ansible.builtin.dnf:
        name: "{{ docker_conflicting_dnf_packages | select('in', ansible_facts['packages'].keys() | list) | list }}"
        state: absent
      become: true
      when: (docker_conflicting_dnf_packages | select('in', ansible_facts['packages'].keys() | list) | list) | length > 0

    - name: Import Docker's RPM signing key
      ansible.builtin.rpm_key:
        key: "{{ docker_rpm_key_url }}"
        state: present
      become: true

    - name: Configure Docker's DNF repository
      ansible.builtin.get_url:
        url: "{{ docker_dnf_repo_url }}"
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"
      become: true

    - name: Install Docker Engine packages
      ansible.builtin.dnf:
        name: "{{ docker_packages }}"
        state: present
      become: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  become: true
  loop:
    - containerd
    - docker
  when:
    - ansible_facts['system'] == 'Linux'
    - not ansible_check_mode

- name: Let the workstation user run Docker without sudo
  ansible.builtin.user:
    name: "{{ workstation_user }}"
    groups: docker
    append: true
  become: true
  register: docker_group
  when: ansible_facts['system'] == 'Linux'

- name: Remind to log out after joining the docker group
  ansible.builtin.debug:
    msg: "{{ workstation_user }} was added to the docker group. Log out and back in before running docker without sudo."
  when:
    - ansible_facts['system'] == 'Linux'
    - docker_group.changed | default(false)
