- name: Remove the Flameshot package
  ansible.builtin.package:
    name: flameshot
    state: absent
  become: true

- name: Remove the Flameshot KDE launcher
  ansible.builtin.file:
    path: "{{ workstation_home }}/.local/share/applications/flameshot-gui.desktop"
    state: absent

- name: Remove the Flameshot KDE global shortcut
  ansible.builtin.shell: |
    if command -v kwriteconfig6 >/dev/null 2>&1; then
      writer=kwriteconfig6
    elif command -v kwriteconfig5 >/dev/null 2>&1; then
      writer=kwriteconfig5
    else
      printf 'KDE config tools are not installed\n'
      exit 0
    fi

    current="$("$writer" --file kglobalshortcutsrc --group flameshot-gui.desktop --key _launch 2>/dev/null || true)"
    if [ -n "$current" ]; then
      "$writer" --file kglobalshortcutsrc --group flameshot-gui.desktop --key _launch --delete
      printf 'changed\n'
    else
      printf 'unchanged\n'
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ workstation_user }}"
  environment:
    HOME: "{{ workstation_home }}"
  register: kde_flameshot_shortcut_result
  changed_when: "'changed' in kde_flameshot_shortcut_result.stdout"

- name: Refresh KDE service cache
  ansible.builtin.shell: |
    if command -v kbuildsycoca6 >/dev/null 2>&1; then
      kbuildsycoca6
    elif command -v kbuildsycoca5 >/dev/null 2>&1; then
      kbuildsycoca5
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ workstation_user }}"
  environment:
    HOME: "{{ workstation_home }}"
  changed_when: false
  when: kde_flameshot_shortcut_result.changed

- name: Configure KDE dark theme
  ansible.builtin.shell: |
    if command -v kwriteconfig6 >/dev/null 2>&1; then
      writer=kwriteconfig6
      reader=kreadconfig6
    elif command -v kwriteconfig5 >/dev/null 2>&1; then
      writer=kwriteconfig5
      reader=kreadconfig5
    else
      printf 'KDE config tools are not installed\n'
      exit 0
    fi

    changed=0
    current_scheme="$($reader --file kdeglobals --group General --key ColorScheme 2>/dev/null || true)"
    if [ "$current_scheme" != "{{ kde_color_scheme }}" ]; then
      "$writer" --file kdeglobals --group General --key ColorScheme "{{ kde_color_scheme }}"
      changed=1
    fi

    current_package="$($reader --file kdeglobals --group KDE --key LookAndFeelPackage 2>/dev/null || true)"
    if [ "$current_package" != "{{ kde_look_and_feel_package }}" ]; then
      "$writer" --file kdeglobals --group KDE --key LookAndFeelPackage "{{ kde_look_and_feel_package }}"
      changed=1
    fi

    if [ "$changed" -eq 1 ]; then
      printf 'changed\n'
    else
      printf 'unchanged\n'
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ workstation_user }}"
  environment:
    HOME: "{{ workstation_home }}"
  register: kde_theme_result
  changed_when: "'changed' in kde_theme_result.stdout"

# Keep the screen locking after a minute, but do not suspend while long jobs run.
# This used to live in the Timeshift role, but Fedora now uses Snapper and the
# settings are useful whether snapshots are enabled or not.
- name: Set KDE lock-screen and suspend defaults
  ansible.builtin.shell: |
    if command -v kwriteconfig6 >/dev/null 2>&1; then
      writer=kwriteconfig6
    elif command -v kwriteconfig5 >/dev/null 2>&1; then
      writer=kwriteconfig5
    else
      printf 'KDE config tools are not installed\n'
      exit 0
    fi

    "$writer" --file kscreenlockerrc --group Daemon --key Autolock true
    "$writer" --file kscreenlockerrc --group Daemon --key Timeout "{{ kde_screen_lock_timeout }}"

    if [ "{{ kde_disable_autosuspend | bool }}" = "True" ]; then
      "$writer" --file powerdevilrc --group AC --group SuspendSession --key suspendType 0
      "$writer" --file powerdevilrc --group Battery --group SuspendSession --key suspendType 0
    fi

    if command -v qdbus6 >/dev/null 2>&1; then
      qdbus6 org.kde.screensaver /ScreenSaver org.kde.screensaver.configure >/dev/null 2>&1 || true
    elif command -v qdbus >/dev/null 2>&1; then
      qdbus org.kde.screensaver /ScreenSaver org.kde.screensaver.configure >/dev/null 2>&1 || true
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ workstation_user }}"
  environment:
    HOME: "{{ workstation_home }}"
  when: not ansible_check_mode
