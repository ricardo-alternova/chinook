name: Test

on:
  push:
  pull_request:

jobs:
  configure-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install pyyaml
      - name: Check installer syntax
        run: bash -n install
      - name: Run configurator tests
        run: python3 -m unittest discover -s tests -v
        env:
          CHINOOK_CHECK_APT: "1"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install pyyaml ansible-core
      # macOS still ships bash 3.2, which is what the installer targets.
      - name: Check installer syntax with the system bash
        run: /bin/bash -n install
      - name: Run configurator tests
        run: python3 -m unittest discover -s tests -v
      - name: Check playbook syntax
        run: |
          for playbook in ansible/playbooks/*.yml; do
            case "$playbook" in */tasks/*) continue ;; esac
            ansible-playbook "$playbook" --syntax-check
          done

  windows-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $files = @('install.ps1', 'windows/Chinook.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }
      - name: Run the Windows script self-check
        shell: pwsh
        run: ./windows/Chinook.ps1 -Check
      - name: Run the Windows bootstrap check
        shell: pwsh
        run: ./install.ps1 -Check
      - name: Run the Windows catalog self-test
        shell: pwsh
        run: ./windows/Chinook.ps1 -SelfTest

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 checks
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Check
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\Chinook.ps1 -Check
          powershell -NoProfile -ExecutionPolicy Bypass -File windows\Chinook.ps1 -SelfTest
